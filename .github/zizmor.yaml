# Workflow action references are pinned to tag refs and verified against
# .github/workflows/actions.lock (managed by `gh actions-lock`) instead of
# bare commit SHAs in-line. unpinned-uses is scoped off for these files
# since the lockfile provides the same integrity guarantee.
rules:
  unpinned-uses:
    ignore:
      - bot.yml
      - build.yml
      - chart.yml
      - ci.yml
      - cleanup.yml
      - container.yml
      - package.yml
      - plugin.yml
      - review.yml
      - scorecard.yml
      - trivy.yml
