name: Helm Chart Build Workflow
description: |
  Build and publish Helm charts using GitHub Actions.
  This action builds Helm charts and pushes them to a container registry.
  It supports linting, installing, packaging, and keyless-signing published charts with cosign.
  Callers that set publish: true must grant the job `packages: write` (registry push)
  and `id-token: write` (keyless cosign signing) permissions.

inputs:
  context:
    description: Context directory for the build (default is current directory)
    default: .
    required: false
  registry_url:
    description: Container registry to push to (default is ghcr.io)
    default: ghcr.io
    required: false
  registry_username:
    description: Username for the container registry (default is GITHUB_ACTOR)
    default: ${{ github.actor }}
    required: false
  registry_password:
    description: Password for the container registry (default is GITHUB_TOKEN)
    default: ${{ secrets.GITHUB_TOKEN }}
    required: false
  publish:
    description: Whether to publish the artefact
    default: "false"
    required: false

runs:
  using: composite
  steps:
    - name: Set up Helm
      uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
      with:
        version: v3.17.0

    - name: Set up chart-testing
      uses: helm/chart-testing-action@0d28d3144d3a25ea2cc349d6e59901c4ff469b3b # v2.7.0
      with:
        chart-dir: ${{ inputs.context }}

    - name: Run chart-testing (list-changed)
      id: list-changed
      shell: bash
      env:
        BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        changed=$(ct list-changed --target-branch $BRANCH)
        if [[ -n "$changed" ]]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Run chart-testing (lint)
      if: steps.list-changed.outputs.changed == 'true'
      shell: bash
      env:
        BRANCH: ${{ github.event.repository.default_branch }}
      run: ct lint --target-branch $BRANCH

    - name: Create kind cluster
      uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
      if: steps.list-changed.outputs.changed == 'true'

    - name: Run chart-testing (install)
      if: steps.list-changed.outputs.changed == 'true'
      shell: bash
      env:
        BRANCH: ${{ github.event.repository.default_branch }}
      run: ct install --target-branch $BRANCH

    - name: Package Helm chart
      id: pack
      if: steps.list-changed.outputs.changed == 'true' && inputs.publish == 'true'
      shell: bash
      env:
        CONTEXT: ${{ inputs.context }}
        WORKSPACE: ${{ github.workspace }}
      run: |
        echo "##[group]Packing Helm chart"
        ct package --chart-dirs $CONTEXT --output-dir $WORKSPACE/charts
        echo "##[endgroup]"
        echo "packed_chart=$(ls $WORKSPACE/charts/*.tgz)" >> "$GITHUB_OUTPUT"

    - name: Login to Container Registry
      uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
      if: steps.list-changed.outputs.changed == 'true' && inputs.publish == 'true'
      with:
        password: ${{ inputs.registry_password }}
        registry: ${{ inputs.registry_url }}
        username: ${{ inputs.registry_username }}

    - name: Publish Helm chart
      id: push
      if: steps.list-changed.outputs.changed == 'true' && inputs.publish == 'true'
      shell: bash
      env:
        CHART: ${{ steps.pack.outputs.packed_chart }}
        REGISTRY: ${{ inputs.registry_url }}
        USERNAME: ${{ inputs.registry_username }}
      run: |
        echo "##[group]Pushing Helm chart"
        output=$(helm push "$CHART" "oci://$REGISTRY/$USERNAME" 2>&1 | tee /dev/stderr)
        echo "digest=$(echo "$output" | grep -oE 'sha256:[a-f0-9]+' | head -n1)" >> "$GITHUB_OUTPUT"
        echo "ref=$(echo "$output" | grep -oE 'Pushed: .*' | sed 's/^Pushed: //')" >> "$GITHUB_OUTPUT"
        echo "##[endgroup]"

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      if: inputs.publish == 'true'

    - name: Sign chart with cosign
      if: steps.list-changed.outputs.changed == 'true' && inputs.publish == 'true'
      shell: bash
      env:
        DIGEST: ${{ steps.push.outputs.digest }}
        REF: ${{ steps.push.outputs.ref }}
      run: ref="${REF#oci://}"; cosign sign --yes "${ref%:*}@${DIGEST}"

    - name: Attest Build Provenance
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
      if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.list-changed.outputs.changed == 'true' && inputs.publish == 'true'
      with:
        push-to-registry: true
        subject-digest: ${{ steps.push.outputs.digest }}
        subject-name: ${{ steps.push.outputs.ref }}
